defaults: ../../grpo_math_1B.yaml
# Long-context CP convergence recipe for Gemma-4 26B-A4B-it: context_parallel_size=16
# on 4n8g (dp2 x cp16, EP=32) with max_total_sequence_length=32768. Derived from the
# validated cp=2 4k recipe (dapo-gemma4-26ba4b-it-4n8g-fsdp2-automodel + cp2) by
# scaling cp to shard the 8x longer sequence (per-rank shard 32768/16=2048, matching
# the 4k per-rank load), plus the long-context dials from the E2B cp16-32k recipe.
# Unlike E2B, 26B-A4B has NO kv-sharing, so activation_checkpointing stays ON.
# Model-owned CP fixes: NeMo-RL gemma4-cp 0cc0002f5 (shared_kv_states skip + autocast
# + non-layer unshard). sequence packing off (NeMo-RL blocks CP+packing).
grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 8
  batch_multiplier: 3
  use_leave_one_out_baseline: false
  val_period: 15
  max_val_samples: 256
  val_batch_size: 256
  use_dynamic_sampling: true
  reward_scaling:
    enabled: true
    target_min: -1.0
  reward_shaping:
    enabled: true
    overlong_buffer_length: 1024
    max_response_length: 30720
loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
  ratio_clip_max: 0.28
  ratio_clip_c: 10
checkpointing:
  checkpoint_dir: results/dapo-gemma4-26ba4b-it-4n8g-fsdp2-cp16-32k-automodel
  save_period: 25
policy:
  model_name: google/gemma-4-26B-A4B-it
  train_global_batch_size: 64
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 32768
  logprob_chunk_size: 4096
  optimizer:
    name: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
    kwargs:
      lr: 1.0e-06
      weight_decay: 0.1
      master_weights: true
      store_param_remainders: true
      exp_avg_dtype: torch.bfloat16
      exp_avg_sq_dtype: torch.bfloat16
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 1.0e-08
      end_factor: 1.0
      total_iters: 10
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones:
    - 10
  dtensor_cfg:
    context_parallel_size: 16
    expert_parallel_size: 32
    activation_checkpointing: true
    automodel_kwargs:
      backend:
        _target_: nemo_automodel.components.models.common.utils.BackendConfig
        attn: te
        linear: te
        rms_norm: te
        experts: gmm
        dispatcher: deepep
        fake_balanced_gate: false
        rope_fusion: false
        enable_hf_state_dict_adapter: true
      freeze_config:
        freeze_vision_tower: true
        freeze_audio_tower: true
        freeze_language_model: false
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: true
  make_sequence_length_divisible_by: 8
  generation:
    max_new_tokens: 30720
    vllm_cfg:
      tensor_parallel_size: 4
      max_model_len: 32768
      gpu_memory_utilization: 0.5
    vllm_kwargs:
      language_model_only: true
data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
logger:
  log_dir: logs/dapo-gemma4-26ba4b-it-4n8g-fsdp2-cp16-32k-automodel
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemorl-gemma4-support
    name: dapo-gemma4-26ba4b-it-4n8g-fsdp2-cp16-32k-automodel
cluster:
  gpus_per_node: 8
  num_nodes: 4
