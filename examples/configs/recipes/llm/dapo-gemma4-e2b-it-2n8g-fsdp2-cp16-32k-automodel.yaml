defaults: ../../grpo_math_1B.yaml
# Long-context CP variant of dapo-gemma4-e2b-it: context_parallel_size=8 on 1n8g
# (dp1 x cp8) with max_total_sequence_length=16384 to exercise Gemma4's model-owned
# context parallelism at long sequence. Constraints (from Automodel's
# gemma4_e4b_tulu3_text_cp16_64k reference): activation_checkpointing MUST be off
# (E2B kv-sharing breaks under AC recompute), no TP for E2B/E4B (scale via cp only),
# sequence packing off (NeMo-RL blocks CP+packing). Rollout count is reduced so the
# long-sequence steps stay testable on a single dp group.
grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 8
  batch_multiplier: 3
  val_period: 15
  max_val_samples: 256
  val_batch_size: 256
  use_leave_one_out_baseline: false
  use_dynamic_sampling: true
  reward_scaling:
    enabled: true
    target_min: -1.0
  reward_shaping:
    enabled: true
    overlong_buffer_length: 1024
    max_response_length: 30720
loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: "tis"
  truncated_importance_sampling_ratio: 2
  ratio_clip_max: 0.28
  ratio_clip_c: 10
checkpointing:
  checkpoint_dir: results/dapo-gemma4-e2b-it-1n8g-fsdp2-cp16-32k-2n-automodel
policy:
  model_name: google/gemma-4-E2B-it
  tokenizer:
    name: google/gemma-4-E2B-it
  train_global_batch_size: 64
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 32768
  logprob_chunk_size: 4096
  optimizer:
    name: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
    kwargs:
      lr: 2.0e-06
      weight_decay: 0.1
      master_weights: true
      store_param_remainders: true
      exp_avg_dtype: torch.bfloat16
      exp_avg_sq_dtype: torch.bfloat16
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 1.0e-08
      end_factor: 1.0
      total_iters: 10
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones:
    - 10
  dtensor_cfg:
    # cp8 (dp1 on 1n8g). AC off: E2B kv-sharing is incompatible with gradient
    # checkpointing (shared-layer read breaks under recompute). No TP/SP for E2B/E4B.
    context_parallel_size: 16
    activation_checkpointing: false
    automodel_kwargs:
      freeze_config:
        freeze_vision_tower: true
        freeze_audio_tower: true
        freeze_language_model: false
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: true
  make_sequence_length_divisible_by: 1
  generation:
    max_new_tokens: 30720
    vllm_cfg:
      max_model_len: 32768
      gpu_memory_utilization: 0.5
data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
logger:
  log_dir: logs/dapo-gemma4-e2b-it-1n8g-fsdp2-cp16-32k-2n-automodel
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemorl-gemma4-support
    name: dapo-gemma4-e2b-it-1n8g-fsdp2-cp16-32k-2n-automodel
cluster:
  gpus_per_node: 8
  num_nodes: 2
