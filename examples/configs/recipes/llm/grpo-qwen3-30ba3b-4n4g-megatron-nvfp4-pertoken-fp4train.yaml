defaults: grpo-qwen3-30ba3b-4n4g-megatron-nvfp4-pertoken.yaml
# M1 recipe + TE NVFP4 per-token TRAINING: real quantized compute in the
# Megatron GEMMs (per-token activation scaling via NVTE knobs), matching the
# per-token rollout. First 2 / last 4 layers stay BF16 (f2l4, mirroring the
# m-inf precision study's nvfp4_pertoken leg).
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-4n4g-megatron-nvfp4-pertoken-fp4train
policy:
  generation:
    nvfp4_pertoken_rollout:
      enabled: true
      # DEFAULT_NVFP4_IGNORE + the f2l4 layers (first 2 / last 4 of 48 stay
      # BF16 in training below, so the rollout must not quantize their experts
      # either — the worker warns on this train/gen precision divergence).
      # An explicit ignore list REPLACES the default, so the default entries
      # are repeated here.
      ignore:
        - "*lm_head*"
        - "*mlp.gate"
        - "*mlp.gate.*"
        - "*mlp.shared_expert*"
        - "*self_attn*"
        - "*embed_tokens*"
        - "*input_layernorm*"
        - "*post_attention_layernorm*"
        - "*norm*"
        - "*.layers.0.mlp.experts*"
        - "*.layers.1.mlp.experts*"
        - "*.layers.44.mlp.experts*"
        - "*.layers.45.mlp.experts*"
        - "*.layers.46.mlp.experts*"
        - "*.layers.47.mlp.experts*"
  megatron_cfg:
    # The performance parent pins fp64 router probs; with fp4_cfg enabled the
    # MoE experts route permuted_probs through TE's quantization padding
    # (fused_multi_row_padding), which has no fp64 kernel — the first logprob
    # forward dies with "GetTransformerEngineDType: Invalid type (7)".
    moe_router_dtype: fp32
    optimizer:
      use_precision_aware_optimizer: false
    fp4_cfg:
      enabled: true
      fp4: e2m1
      fp4_recipe: nvfp4
      fp4_param: false
    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 2
    num_layers_at_end_in_bf16: 4
    # fp4_cfg above makes the interior layers NVFP4 globally (attention too).
    # This TE per-module recipe demotes attention (linear_qkv/linear_proj) back
    # to BF16, leaving only the MoE-expert linears (linear_fc1/linear_fc2) in
    # NVFP4 — matching the experts-only per-token rollout so the training
    # forward and the rollout forward agree (lower gen_kl/token_mult_prob).
    te_precision_config_file: examples/configs/te_precision/attn_bf16_mlp_nvfp4.yaml
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
      NVTE_NVFP4_ROW_SCALED_ACTIVATION: '1'
      NVTE_NVFP4_DISABLE_RHT: '1'
      NVTE_NVFP4_DISABLE_2D_QUANTIZATION: '1'
      NVTE_NVFP4_DISABLE_STOCHASTIC_ROUNDING: '1'
      NVTE_BACKWARD_OVERRIDE: dequantized
logger:
  log_dir: logs/grpo-qwen3-30ba3b-4n4g-megatron-nvfp4-pertoken-fp4train
  wandb:
    name: grpo-qwen3-30ba3b-4n4g-megatron-nvfp4-pertoken-fp4train
