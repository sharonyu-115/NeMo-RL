defaults: grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-fp4bwd-w2d.yaml
# Weight-2D (per-tensor scalar outer amax + 16x16 inner tiles) + ROUTER REPLAY.
# Single dial on top of -w2d, so -w2d is its matched control.
#
# The question: router replay and 2D weights each independently rescue learning
# under real FP4 per-token backward — replay in -fp4bwd-r3 (vs the flat -fp4bwd
# baseline), 2D weights in -w2d (which learns with replay OFF). Are the two fixes
# REDUNDANT (replay adds nothing once the fwd/bwd transposition bias is gone) or
# ADDITIVE (replay still removes a separate train/gen routing mismatch on top)?
# That decides whether a shipping recipe needs both or only the cheaper one.
#
# Reads three ways:
#   vs -w2d          -> the replay dial, weight geometry held at scalar/16x16
#   vs -fp4bwd-r3    -> the weight dial, replay held on
#   vs -fp4bwd       -> both fixes together against neither
#
# Minimal enablement (only router_replay.enabled), matching -fp4bwd-r3: the vLLM
# monolithic-capture fix (patches.py::_patch_vllm_moe_routed_experts_capture,
# commit 1d3f0eea8) means the old sampling/packing/prefix-caching workarounds are
# NOT needed, so DAPO sampling and packing stay identical to -w2d.
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-fp4bwd-w2d-r3
policy:
  router_replay:
    enabled: true
logger:
  wandb:
    name: grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-fp4bwd-w2d-r3
