defaults: grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-fp4bwd.yaml
# Weight-quantization ablation leg B on top of the per-token FP4 backward run:
# per-tensor scalar outer amax + 16x16 inner tiles (the stock TE weight-2D route,
# NVTE_NVFP4_PER_TOKEN_WEIGHT_2D=1 — no patch required).
#
# A 16x16 tile holds the same 256 numbers whichever way the matrix is read, so
# the forward (rowwise) and dgrad (columnwise) weights are identical — verified
# byte-exact at the cast level (0.00% mismatch, all shapes) in
# research/vllm-nvfp4-pertoken/verify_w1d_weight_legs.py. That removes the
# forward/backward transposition bias, at the cost of one scale per 256 elements.
#
# This is the CONTROL for the -w1d leg: w1d differs from this recipe in exactly
# one dial (inner-block geometry, 16x16 tiles -> 16-element rows) while the outer
# amax stays a per-tensor scalar in both. Comparing w1d against the plain fp4bwd
# baseline instead would confound the geometry change with the outer-amax change.
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-fp4bwd-w2d
policy:
  megatron_cfg:
    fp4_cfg:
      per_token_weight_2d: true
logger:
  wandb:
    name: grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-fp4bwd-w2d
