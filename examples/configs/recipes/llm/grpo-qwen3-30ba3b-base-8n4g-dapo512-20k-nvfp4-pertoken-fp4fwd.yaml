defaults: grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-fp4bwd.yaml
# LEG 2 of the fwd/bwd A/B: FULL per-token FORWARD + DEQUANTIZED (BF16) backward.
# Identical to -fp4bwd (same per-token cast, f2l4, DAPO-512, 1500 steps) EXCEPT
# the backward stays dequantized — isolating the forward-cast change
# (row-scaled -> full per-token) from the FP4 per-token backward.
#   leg 1: row-scaled fwd + dequant bwd  (PRECISION=nvfp4, the base -pertoken run)
#   leg 2: full per-token fwd + dequant bwd  (this recipe)
#   leg 3: full per-token fwd + FP4 bwd  (-fp4bwd)
# NVTE_NVFP4_PER_TOKEN=1 forces the per-token forward cast; fp4_cfg.backward=
# dequantized keeps NVTE_BACKWARD_OVERRIDE=dequantized (BF16 backward). Still needs
# the te690 image (the per-token cast is a PR #3045 feature).
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-fp4fwd
policy:
  megatron_cfg:
    fp4_cfg:
      backward: dequantized
    env_vars:
      NVTE_NVFP4_PER_TOKEN: "1"
logger:
  wandb:
    name: grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-fp4fwd
