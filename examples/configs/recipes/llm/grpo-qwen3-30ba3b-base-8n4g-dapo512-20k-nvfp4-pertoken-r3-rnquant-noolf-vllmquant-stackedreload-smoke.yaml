defaults: ./grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-r3-rnquant-noolf-vllmquant-reloadweights-verify.yaml

# One-refit performance smoke for the default-off layer-stacked NVFP4 loader.
# Everything else inherits from reloadweights-verify so its refit timing can be
# compared with the existing per-expert reload_weights run.
grpo:
  max_num_steps: 1

checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-r3-rnquant-noolf-vllmquant-stackedreload-smoke

policy:
  generation:
    nvfp4_pertoken_rollout:
      experimental_stacked_reload: true

logger:
  wandb:
    name: grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-r3-rnquant-noolf-vllmquant-stackedreload-smoke
