defaults: grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-bf16.yaml
# NVFP4 per-token W4A4 long run: identical DAPO-512 / 20k / topology to the BF16
# baseline, plus real NVFP4 per-token TRAINING (MLP/expert linears only, attention
# BF16) and per-token W4A4 vLLM rollout — the config validated in the 2-step smoke
# (job 2411458): gen_kl 0.011, below BF16-train. Only the quant deltas live here.
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken
policy:
  generation:
    # No moe_backend override: the BF16 base leaves it unset (the launcher only
    # injects triton for PRECISION=bf16), so NVFP4 uses vLLM auto-selection.
    # Auto picks flashinfer_trtllm for the NVFP4-quantized experts (the
    # per-token kernel requires it) and a working backend for the f2l4 BF16
    # experts — the config the 10-step run (job 2414459) validated. Forcing a
    # single value fails: triton is rejected for NVFP4 MoE, and a flashinfer
    # value would be forced onto the f2l4 BF16 experts (untested).
    # Per-token W4A4 rollout: weights real-quantized at refit, activations
    # per-token dynamic in vLLM. Ignore mirrors training coverage — attention /
    # router / shared / norms BF16, and the f2l4 layers' experts (0-1, 44-47)
    # stay BF16 since training keeps those layers BF16 (explicit list REPLACES
    # the default, so the defaults are repeated).
    nvfp4_pertoken_rollout:
      enabled: true
      ignore:
        - "*lm_head*"
        - "*mlp.gate"
        - "*mlp.gate.*"
        - "*mlp.shared_expert*"
        - "*self_attn*"
        - "*embed_tokens*"
        - "*input_layernorm*"
        - "*post_attention_layernorm*"
        - "*norm*"
        - "*.layers.0.mlp.experts*"
        - "*.layers.1.mlp.experts*"
        - "*.layers.44.mlp.experts*"
        - "*.layers.45.mlp.experts*"
        - "*.layers.46.mlp.experts*"
        - "*.layers.47.mlp.experts*"
  megatron_cfg:
    # Global NVFP4 default; the TE per-module recipe below demotes attention back
    # to BF16 so only linear_fc1/fc2 (MoE experts) train in NVFP4 — matching the
    # experts-only rollout (train/gen alignment, see CONFIG-fp4train.md).
    fp4_cfg:
      enabled: true
      fp4: "e2m1"
      fp4_recipe: "nvfp4"
      fp4_param: false
    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 2
    num_layers_at_end_in_bf16: 4
    te_precision_config_file: examples/configs/te_precision/attn_bf16_mlp_nvfp4.yaml
    optimizer:
      use_precision_aware_optimizer: false
    env_vars:
      NRL_MEGATRON_CHECKPOINT_DIR: /lustre/fsw/general_sa/shuangy/hf/megatron_ckpt
      # See the BF16 recipe: :False avoids the pidfd-based cuMem IPC that the
      # container ptrace policy blocks during weight refit;
      # garbage_collection_threshold:0.8 releases cached blocks so colocated
      # wake/sleep cycles don't fragment the GPU into a vLLM wake_up OOM.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False,garbage_collection_threshold:0.8
      NVTE_NVFP4_ROW_SCALED_ACTIVATION: "1"
      NVTE_NVFP4_DISABLE_RHT: "1"
      NVTE_NVFP4_DISABLE_2D_QUANTIZATION: "1"
      NVTE_NVFP4_DISABLE_STOCHASTIC_ROUNDING: "1"
      NVTE_BACKWARD_OVERRIDE: "dequantized"
logger:
  wandb:
    name: grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken
