defaults: vlm_grpo_3B.yaml
grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_num_steps: 10000
  use_dynamic_sampling: false
  batch_multiplier: 1
  val_period: 5
  max_val_samples: 512
  val_batch_size: 512
  use_leave_one_out_baseline: true
  normalize_rewards: true
  reward_scaling:
    enabled: false
  reward_shaping:
    enabled: false
loss_fn:
  reference_policy_kl_penalty: 0.0
  reference_policy_kl_type: "k3"
  ratio_clip_min: 0.2
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 2
  truncated_importance_sampling_type: tis
  ratio_clip_max: 0.28
  ratio_clip_c: 10
  token_level_loss: true
checkpointing:
  checkpoint_dir: results/vlm-grpo-qwen35-35b-geo3k
  keep_top_k: 2
  save_period: 2
policy:
  model_name: Qwen/Qwen3-30B-A3B-Base
  train_global_batch_size: 512
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 3072
  precision: "bfloat16"
  dynamic_batching:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64
  sequence_packing:
    enabled: false
  optimizer:
    kwargs:
      lr: 1.0e-06
      weight_decay: 0.1
  scheduler:
    - name: torch.optim.lr_scheduler.LinearLR
      kwargs:
        start_factor: 1.0e-08
        end_factor: 1.0
        total_iters: 10
    - name: torch.optim.lr_scheduler.ConstantLR
      kwargs:
        factor: 1.0
        total_iters: 10000000000
    - milestones:
        - 10
  generation:
    max_new_tokens: 2048
    vllm_cfg:
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.75
      enforce_eager: false
      max_model_len: 3072
      skip_tokenizer_init: False
data:
  max_input_seq_length: 1024
  train:
    dataset_name: geometry3k
    split: train
  validation:
    dataset_name: geometry3k
    split: test
  default:
    prompt_file: examples/prompts/geo3k.txt
    processor: "vlm_hf_data_processor"
    env_name: "geometry3k"
env:
  geometry3k:
    num_workers: 8
    reward_functions:
      - name: format
        weight: 0.1
      - name: math_expr
        weight: 0.9
logger:
  monitor_gpus: false
  num_val_samples_to_print: 2
  wandb:
    project: nemorl-qwen35
    name: qwen35-35b-vlm-grpo-geo3k
cluster:
  gpus_per_node: 8
  num_nodes: 1
